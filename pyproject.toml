[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-memory"
version = "5.0.0"
description = "Native Hermes intelligence and organisational memory plugin with Tencent MemoryCore and self-evolution."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jarvis AI Team" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "mcp>=1.0,<2",
    "pydantic>=2",
    "httpx>=0.27",
    "psutil>=5.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.entry-points."hermes_agent.plugins"]
jarvis = "jarvis_memory.hermes_plugin:register"

[project.entry-points."hermes_agent.memory_providers"]
jarvis = "jarvis_memory.hermes_memory_provider:provider_factory"

[project.scripts]
jarvis-server = "jarvis_memory.orchestrator:main"

[tool.setuptools.packages.find]
where = ["src"]
